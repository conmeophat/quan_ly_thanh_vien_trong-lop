name: Python and deployment tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py database.py security.py test_permissions.py deploy/windows-standby/sqlite_tools.py
      - name: Compile Cloudflare Python Worker
        run: python -m py_compile cloudflare/worker.py
      - name: Validate Cloudflare frontend JavaScript
        run: node --check cloudflare/public/app.js
      - name: Validate Cloudflare D1 schema
        run: |
          python - <<'PY'
          import pathlib
          import sqlite3

          connection = sqlite3.connect(":memory:")
          for migration in sorted(pathlib.Path("cloudflare/migrations").glob("*.sql")):
              connection.executescript(migration.read_text(encoding="utf-8"))
          expected = {"users", "score_entries", "evaluations", "login_throttle", "audit_logs", "roster_assignments", "daily_scores"}
          actual = {
              row[0]
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          assert expected <= actual, f"Missing D1 tables: {expected - actual}"
          print("D1 schema OK:", ", ".join(sorted(expected)))
          PY
      - name: Validate shell deployment scripts
        run: find deploy/oracle -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run permission tests
        run: python -m unittest -v
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem deploy/windows-standby -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.Name): $_" }
              exit 1
            }
          }
      - name: Run Windows standby SQLite tests
        run: python -m unittest discover -s deploy/windows-standby -p 'test_*.py' -v
